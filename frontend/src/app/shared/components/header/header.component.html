<header class="liquid-glass-header app-header">
  <div class="header-container">
    <a routerLink="/" class="brand-logo" aria-label="Repara.ai Inicio">
      <span class="brand-name">Repara</span><span class="brand-dot">.ai</span>
      <span class="brand-tagline">Ferretería Inteligente</span>
    </a>

    <nav class="header-actions">
      <button
        type="button"
        class="cart-trigger-btn"
        (click)="openCart()"
        aria-label="Abrir carrito de compras"
      >
        <i class="pi pi-shopping-bag cart-icon" aria-hidden="true"></i>
        @if (carritoService.itemCount() > 0) {
          <span class="cart-count-badge">{{ carritoService.itemCount() }}</span>
        }
      </button>

      @if (authService.isAuthenticated()) {
        <div class="user-badge">
          <i class="pi pi-user user-icon" aria-hidden="true"></i>
          <span class="user-name">{{ authService.currentUser()?.username }}</span>
          @if (authService.isAdmin()) {
            <span class="admin-badge">Admin</span>
          }
        </div>

        <button
          pButton
          type="button"
          label="Cerrar sesión"
          class="p-button-outlined p-button-sm logout-button"
          (click)="logout()"
        ></button>
      } @else {
        <button
          pButton
          type="button"
          label="Ingresar"
          class="p-button-outlined p-button-sm login-button"
          (click)="openLogin()"
        ></button>

        <button
          pButton
          type="button"
          label="Registrarse"
          class="p-button-primary p-button-sm register-button"
          (click)="openRegister()"
        ></button>
      }
    </nav>
  </div>
</header>
