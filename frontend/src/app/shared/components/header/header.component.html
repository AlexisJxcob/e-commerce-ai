<header class="liquid-glass-header app-header">
  <div class="header-container">
    <a routerLink="/" class="brand-logo" aria-label="Repara.ai Inicio">
      <span class="brand-name">Repara</span><span class="brand-dot">.ai</span>
      <span class="brand-tagline">Ferretería Inteligente</span>
    </a>

    <nav class="header-actions">
      <p-button
        type="button"
        icon="pi pi-shopping-bag"
        [badge]="cartBadgeValue()"
        variant="outlined"
        size="small"
        [rounded]="true"
        (onClick)="openCart()"
        ariaLabel="Abrir carrito de compras"
        styleClass="cart-header-button"
      ></p-button>

      @if (authService.isAuthenticated()) {
        @if (authService.isAdmin()) {
          <a routerLink="/admin" class="admin-nav-link" aria-label="Panel de administración">
            <i class="pi pi-cog" aria-hidden="true"></i>
            <span class="admin-label">Admin</span>
          </a>
        }

        <div class="user-badge" [title]="authService.currentUser()?.username">
          <i class="pi pi-user user-icon" aria-hidden="true"></i>
          <span class="user-name">{{ authService.currentUser()?.username }}</span>
        </div>

        <p-button
          type="button"
          label="Salir"
          icon="pi pi-sign-out"
          size="small"
          variant="outlined"
          severity="secondary"
          styleClass="logout-button"
          (onClick)="logout()"
          ariaLabel="Cerrar sesión"
        ></p-button>
      } @else {
        <p-button
          type="button"
          label="Ingresar"
          icon="pi pi-user"
          size="small"
          variant="outlined"
          styleClass="login-button"
          (onClick)="openLogin()"
        ></p-button>

        <p-button
          type="button"
          label="Registrarse"
          size="small"
          styleClass="register-button"
          (onClick)="openRegister()"
        ></p-button>
      }
    </nav>
  </div>
</header>
