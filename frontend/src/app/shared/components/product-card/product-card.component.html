<article class="product-card" [class.is-out-of-stock]="!hasStock()">
  <a
    class="card-link"
    [routerLink]="['/productos', producto().id]"
    [attr.aria-label]="'Ver ficha técnica de ' + producto().nombre + ', SKU ' + producto().sku"
  >
    <span class="card-plate">
      <img
        class="product-thumb"
        [src]="imagen()"
        alt=""
        aria-hidden="true"
        width="320"
        height="320"
        loading="lazy"
        decoding="async"
        (error)="onImageError()"
      />
    </span>

    <span class="card-body">
      <span class="card-meta">
        <span class="product-sku">SKU {{ producto().sku }}</span>
        <span class="stock-flag" [class.is-out]="!hasStock()">
          <i [class]="hasStock() ? 'pi pi-check' : 'pi pi-times'" aria-hidden="true"></i>
          {{ hasStock() ? producto().stock + ' disponibles' : 'Sin stock' }}
        </span>
      </span>

      <span class="product-name">{{ producto().nombre }}</span>

      <span class="price-line">
        <span class="price-value price-text">{{ producto().precio | clp }}</span>
        <span class="price-note">IVA incluido</span>
      </span>
    </span>
  </a>

  <footer class="card-footer">
    <p-button
      type="button"
      variant="outlined"
      severity="primary"
      size="small"
      icon="pi pi-plus"
      label="Agregar al carro"
      [disabled]="!hasStock()"
      (onClick)="onQuickBuy($event)"
      styleClass="quick-buy-btn"
      [attr.aria-label]="'Agregar ' + producto().nombre + ' al carro'"
    ></p-button>
  </footer>
</article>
