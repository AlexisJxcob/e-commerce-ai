<section class="category-carousel-section" [attr.aria-label]="categoria().nombre">
  <header class="section-header">
    <div class="header-content">
      <div class="title-row">
        <h3 class="category-title">{{ categoria().nombre }}</h3>
        <p-tag
          severity="secondary"
          [value]="contadorProductos()"
        ></p-tag>
      </div>
      @if (categoria().descripcion) {
        <p class="category-desc">{{ categoria().descripcion }}</p>
      }
    </div>
  </header>

  <div class="carousel-wrapper">
    <p-carousel
      [value]="productos()"
      [numVisible]="5"
      [numScroll]="1"
      [circular]="false"
      [responsiveOptions]="responsiveOptions"
      [showIndicators]="mostrarIndicadores()"
      indicatorsContentClass="custom-indicators"
    >
      <ng-template #item let-producto>
        <div class="carousel-card-item">
          <app-product-card
            [producto]="producto"
            (addToCart)="addToCart.emit($event)"
          ></app-product-card>
        </div>
      </ng-template>
    </p-carousel>
  </div>
</section>
