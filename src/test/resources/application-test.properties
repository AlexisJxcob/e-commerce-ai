# Perfil "test": valores de prueba (nunca credenciales reales)
huggingface.chat.key=test-huggingface-key
huggingface.chat.model=test-model

# Secreto JWT de prueba (independiente del de desarrollo/producción)
app.jwt.secret=clave-secreta-test-de-256-bits-para-tests

# Desactivar auto-configuración del modelo de embeddings:
# los tests usan un stub determinista (EmbeddingModelTestConfig).
spring.ai.model.embedding=none

spring.jpa.show-sql=false
