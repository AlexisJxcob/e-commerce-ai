# ===================================================================
# E-Commerce AI - Configuración Base
# Perfiles disponibles: dev, prod
# ===================================================================

# Aplicación
spring.application.name=e-commerce-ai

# ===================================================================
# Base de Datos — Neon Postgres serverless + pgvector
# -------------------------------------------------------------------
# Sin valores por defecto: los connection strings llegan SIEMPRE del
# entorno (fail-fast si faltan) y el repo no contiene hosts ni
# credenciales fijos.
#
#   DATABASE_URL        -> endpoint POOLED   (host con sufijo `-pooler`)
#                          Tráfico normal de la aplicación vía PgBouncer.
#   DATABASE_DIRECT_URL -> endpoint DIRECTO  (host SIN sufijo `-pooler`)
#                          Migraciones Flyway y pg_dump/pg_restore.
#
# Ambas URLs deben llevar `?sslmode=require`: Neon rechaza conexiones sin
# TLS. pgjdbc no acepta userinfo en la autoridad de la URL, de ahí que el
# usuario y la contraseña viajen en DATABASE_USER / DATABASE_PASSWORD.
# ===================================================================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Pool de conexiones (HikariCP) afinado para Neon serverless
# -------------------------------------------------------------------
# Neon escala a cero: el compute se suspende tras unos minutos sin
# actividad y la primera consulta paga un cold start (cientos de ms).
# De ahí estos valores:
#   - minimum-idle=2 y maximum-pool-size=10: en serverless el número de
#     instancias de la app manda; el pooler de Neon multiplexa, así que un
#     pool pequeño por instancia es lo correcto.
#   - connection-timeout=20000: margen para el cold start sin colgar la
#     petición del cliente.
#   - idle-timeout=300000 y max-lifetime=600000: reciclan conexiones antes
#     de que el corte del compute o del pooler las deje zombies.
#   - keepalive-time=60000: Hikari late sobre las conexiones ociosas para
#     detectar antes una conexión muerta.
#   - initialization-fail-timeout=-1: CRÍTICO en Neon. Con el valor por
#     defecto (1) Hikari intenta obtener una conexión al arrancar y aborta
#     si no lo consigue; si el compute está suspendido en ese momento el
#     arranque fallaría. Con -1 el pool arranca sin validar conexión y la
#     obtiene de forma perezosa, en la primera petición real.
# ===================================================================
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:600000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME:60000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT:-1}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ===================================================================
# Flyway (control de versiones declarativo e inmutable del esquema)
# -------------------------------------------------------------------
# Las migraciones viven en src/main/resources/db/migration (V1__...,
# V2__..., ...). baseline-on-migrate=true + baseline-version=1 permite
# arrancar sobre una base existente creada con ddl-auto=update: Flyway
# marca el estado como "equivalente a V1" (baseline) SIN ejecutar V1 ni
# borrar datos; a partir de ahí solo aplica migraciones nuevas.
#
# spring.flyway.url apunta SIEMPRE al endpoint DIRECTO (sin `-pooler`):
# PgBouncer trabaja en modo transacción y no soporta el estado de sesión
# que Flyway necesita (advisory locks de `flyway_schema_history`, DDL y
# `CREATE INDEX CONCURRENTLY` fuera de transacción). Si DATABASE_DIRECT_URL
# no está definida se degrada a DATABASE_URL, nunca a un valor fijo.
#
# user/password se declaran EXPLÍCITAMENTE aunque tengan el mismo valor que
# spring.datasource.*: en cuanto se define spring.flyway.url, Boot construye
# un SimpleDriverDataSource sólo con las propiedades de Flyway y deja de
# heredar las credenciales del DataSource principal. Sin estas dos líneas el
# arranque falla con "The server requested SCRAM-based authentication, but no
# password was provided" (SQLState 08004).
# ===================================================================
spring.flyway.enabled=true
spring.flyway.url=${DATABASE_DIRECT_URL:${DATABASE_URL}}
spring.flyway.user=${DATABASE_USER}
spring.flyway.password=${DATABASE_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===================================================================
# JWT Security
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=${JWT_ISSUER:}

# Seed del usuario administrador (solo se usa si no existe un admin)
app.seed.admin-password=${ADMIN_PASSWORD:admin123}

# ===================================================================
# Hugging Face - Embeddings (Feature Extraction)
# ===================================================================
huggingface.api.key=${HUGGINGFACE_API_KEY}
huggingface.api.model=${HUGGINGFACE_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
huggingface.api.base-url=${HUGGINGFACE_EMBEDDING_BASE_URL:https://router.huggingface.co/hf-inference/models}

# ===================================================================
# Hugging Face - Chat (Inference API)
# ===================================================================
huggingface.chat.key=${HUGGINGFACE_CHAT_API_KEY:${HUGGINGFACE_API_KEY}}
huggingface.chat.model=${HUGGINGFACE_CHAT_MODEL:Meta-Llama/Llama-3.2-3B-Instruct}
huggingface.chat.base-url=${HUGGINGFACE_CHAT_BASE_URL:https://router.huggingface.co/v1}

# ===================================================================
# HTTP Client Configuration
# ===================================================================
spring.http.client.timeout=${HTTP_CLIENT_TIMEOUT:120000}

# ===================================================================
# Server Configuration
# ===================================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.org.springframework=${LOG_LEVEL_SPRING:INFO}
logging.level.org.alexis=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# SpringDoc OpenAPI (Swagger)
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# ===================================================================
# CORS Configuration
# ===================================================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3001,http://localhost:3000}
app.cors.allowed-methods=${CORS_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_HEADERS:*}
app.cors.max-age=${CORS_MAX_AGE:3600}