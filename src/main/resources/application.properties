spring.application.name=e-commerce-ai

spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chat Hugging Face (Inference API — endpoint OpenAI-compatible).
# Reutiliza la misma HUGGINGFACE_API_KEY que los embeddings.
huggingface.chat.key=${HUGGINGFACE_API_KEY}
huggingface.chat.base-url=https://router.huggingface.co/v1
huggingface.chat.model=Meta-Llama/Llama-3.2-3B-Instruct

# Embeddings Hugging Face (Inference API — pipeline feature-extraction).
# Modelo: sentence-transformers/all-MiniLM-L6-v2 → vector de 384 dimensiones.
# La API de embeddings de HF NO es OpenAI-compatible: el endpoint correcto es
# {base-url}/{model}/pipeline/feature-extraction (router.huggingface.co).
# El modelo debe coincidir con vector(384) en Producto.
huggingface.api.key=${HUGGINGFACE_API_KEY}
huggingface.api.model=sentence-transformers/all-MiniLM-L6-v2
huggingface.api.base-url=https://router.huggingface.co/hf-inference/models
