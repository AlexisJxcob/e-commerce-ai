# ===================================================================
# E-Commerce AI - Configuración para Desarrollo
# ===================================================================

# Aplicación
spring.application.name=e-commerce-ai
spring.profiles.active=dev

# ===================================================================
# Base de Datos (PostgreSQL + pgvector)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del pool de conexiones (HikariCP) - Desarrollo
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA / Hibernate - Desarrollo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# JWT Security - Desarrollo
# ===================================================================
app.jwt.secret=clave-secreta-de-256-bits-para-desarrollo-cambiar-en-produccion
app.jwt.expiration=86400000

# ===================================================================
# Hugging Face - Embeddings (Feature Extraction) - Desarrollo
# ===================================================================
huggingface.api.key=${HUGGINGFACE_API_KEY}
huggingface.api.model=sentence-transformers/all-MiniLM-L6-v2
huggingface.api.base-url=https://router.huggingface.co/hf-inference/models

# ===================================================================
# Hugging Face - Chat (Inference API) - Desarrollo
# ===================================================================
huggingface.chat.key=${HUGGINGFACE_API_KEY}
huggingface.chat.model=Meta-Llama/Llama-3.2-3B-Instruct
huggingface.chat.base-url=https://router.huggingface.co/v1

# ===================================================================
# HTTP Client Configuration - Desarrollo
# ===================================================================
spring.http.client.timeout=120000

# ===================================================================
# Server Configuration - Desarrollo
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# ===================================================================
# Logging Configuration - Desarrollo
# ===================================================================
logging.level.org.springframework=INFO
logging.level.org.alexis=DEBUG
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ===================================================================
# SpringDoc OpenAPI (Swagger) - Desarrollo
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================================================================
# CORS Configuration - Desarrollo
# ===================================================================
app.cors.allowed-origins=http://localhost:3001,http://localhost:3000,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600