# ===================================================================
# E-Commerce AI - Configuración para Pruebas
# ===================================================================

# Aplicación
# NOTA: no definir spring.profiles.active aquí. Spring Boot 4 rechaza esa
# propiedad en un recurso específico de perfil; el perfil lo activa
# @ActiveProfiles("test") en los tests.
spring.application.name=e-commerce-ai

# ===================================================================
# Base de Datos (Testcontainers)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/test_db
spring.datasource.username=test
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate - Pruebas
# validate: Flyway construye el esquema sobre el contenedor Testcontainers
# desde cero (V1, incluida la extensión vector); Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# JWT Security - Pruebas
# ===================================================================
app.jwt.secret=test-secret-key-para-pruebas-unitarias

# ===================================================================
# Hugging Face - Pruebas (Mock)
# ===================================================================
huggingface.api.key=test-api-key
huggingface.api.model=sentence-transformers/all-MiniLM-L6-v2
huggingface.api.base-url=http://localhost:9999

huggingface.chat.key=test-api-key
huggingface.chat.model=test-model
huggingface.chat.base-url=http://localhost:9999

# ===================================================================
# Server Configuration - Pruebas
# ===================================================================
server.port=0  # Puerto aleatorio para pruebas

# ===================================================================
# Logging Configuration - Pruebas
# ===================================================================
logging.level.org.springframework=WARN
logging.level.org.alexis=DEBUG

