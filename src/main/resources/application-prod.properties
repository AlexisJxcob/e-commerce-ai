# ===================================================================
# E-Commerce AI - Configuración para Producción
# ===================================================================

# Aplicación
spring.application.name=e-commerce-ai
spring.profiles.active=prod

# ===================================================================
# Base de Datos (PostgreSQL + pgvector)
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del pool de conexiones (HikariCP) - Producción
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ECommerceAI-HikariPool

# JPA / Hibernate - Producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===================================================================
# JWT Security - Producción
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# ===================================================================
# Hugging Face - Embeddings (Feature Extraction) - Producción
# ===================================================================
huggingface.api.key=${HUGGINGFACE_API_KEY}
huggingface.api.model=sentence-transformers/all-MiniLM-L6-v2
huggingface.api.base-url=https://router.huggingface.co/hf-inference/models

# ===================================================================
# Hugging Face - Chat (Inference API) - Producción
# ===================================================================
huggingface.chat.key=${HUGGINGFACE_API_KEY}
huggingface.chat.model=Meta-Llama/Llama-3.2-3B-Instruct
huggingface.chat.base-url=https://router.huggingface.co/v1

# ===================================================================
# HTTP Client Configuration - Producción
# ===================================================================
spring.http.client.timeout=120000

# ===================================================================
# Server Configuration - Producción
# ===================================================================
server.port=${PORT:8080}
server.servlet.context-path=/api
server.forward-headers-strategy=framework

# ===================================================================
# Logging Configuration - Producción
# ===================================================================
logging.level.org.springframework=WARN
logging.level.org.alexis=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/ecommerce-ai.log
logging.file.max-size=10MB
logging.file.max-history=7

# ===================================================================
# SpringDoc OpenAPI (Swagger) - Producción
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha

# ===================================================================
# CORS Configuration - Producción
# ===================================================================
app.cors.allowed-origins=${CORS_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.max-age=3600

# ===================================================================
# Actuator (Health Checks) - Producción
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=always
management.info.env.enabled=true
management.info.git.enabled=true
management.info.build.enabled=true

# ===================================================================
# Cache Configuration - Producción
# ===================================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m